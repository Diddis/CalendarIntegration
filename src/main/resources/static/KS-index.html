<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TE-Canvas Kalenderöverföring</title>
<link rel="stylesheet" href="KS-styles.css" />
</head>
<body>

<div class="page">

  <header class="page-header container">
    <h1>Överför kurskalender från TimeEdit till Canvas</h1>
  </header>

  <main class="container">

    <!-- KS-tillägg börjar här.... -->
    <section class="filter-row" aria-label="Kalenderhämtning">  <!--<section class="filter-row" aria-label="Urval"> -->
      <div class="filter-field" id="search-cal">  <!--<section class="filter-field"> -->          
        <label for="kurskod">Klistra in TimeEdit-URL för kursen:</label> <!-- <label for="kurskod">Kurskod</label><br> -->
        <input
            type="url"
            id="timeeditUrl"
            name="timeeditUrl"
            placeholder="Typ: https://cloud.timeedit.net/ltu/web/schedule1/ri10Q956X55Z07Q6Z76g5Y00y7006Y34706gQY7Q5476.html">            
      </div>

      <div class="filter-field">  <!--<section class="filter-field"> -->          
        <label for="kurskod"></label>  <!-- <label for="kurskod">Kurskod</label><br> -->
        <input type="button" class="transfer-btn" value="Hämta kalenderdata">        
      </div>
    </section>

    <section class="filter-row" aria-label="Kursinfo">   
      <div class="course-field">            
        <p id="course-code"> 
          <strong>Kurskod:</strong>        
        </p>
        <p>
          D0031N D0031N
        </p>
      </div>

      <div class="course-field">            
        <p id="course-name"> 
          <strong>Kursnamn:</strong>        
        </p>
        <p>
          Enterprise Architecture och SOA Enterprise Architecture och SOA      
        </p>
      </div>
    </section>

    <section class="filter-row" aria-label="Kalenderöverföring">  
      <div class="filter-field" id="transfer-cal">       
        <label for="skicka-data"></label>  
        <input type="button" class="transfer-btn" value="Överför kalender till Canvas">        
      </div>
    </section>

    <div class="filter-field">       
      <p id="split-line">
      </p>       
    </div>

    <section class="filter-row" aria-label="Kalenderdata">   <!-- Tidigare:  <section class="table-card" -->
      <div class="course-field table-wrap">   <!-- Tidigare:  <div class="table-wrap"> -->
        <table class="data-table">
          <thead>
            <tr>
              <th class="col-check"></th>
              <th class="date sortable" data-sort-key="date" scope="col" aria-sort="ascending">
                Datum <span class="sort sort-asc" aria-hidden="true"></span>
              </th>
              <th class="sortable" data-sort-key="time" scope="col">
                Tid <span class="sort" aria-hidden="true"></span>
              </th>
              <th class="sortable" data-sort-key="activity-place" scope="col">
                Aktivitet & Plats <span class="sort" aria-hidden="true"></span>
              </th>
              <th class="sortable" data-sort-key="person" scope="col">
                Anställd, Student <span class="sort" aria-hidden="true"></span>
              </th>
              <th class="sortable" data-sort-key="zoom" scope="col">
                Zoom-länk <span class="sort" aria-hidden="true"></span>
              </th>
              <th class="sortable" data-sort-key="comments" scope="col">
                Kommentarer <span class="sort" aria-hidden="true"></span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ....KS-tillägg slutar här -->


    <pre id="json-output" class="json-display"></pre>  

  </main>

</div>

    <script src="KS-main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TE-Canvas Kalenderöverföring</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="page">

  <header class="page-header container">
    <h1>Överför kurskalender från TimeEdit till Canvas</h1>
  </header>

  <main class="container">
    
    <section class="filter-row" aria-label="Kalenderhämtning"> 
      <div class="filter-field" id="search-cal">        
        <label for="kurskod">Klistra in TimeEdit-URL för kursen:</label> 
        <input
            type="url"
            id="timeeditUrl"
            name="timeeditUrl"
            placeholder="Typ: https://cloud.timeedit.net/ltu/web/schedule1/ri10Q956X55Z07Q6Z76g5Y00y7006Y34706gQY7Q5476.html">            
      </div>
      <!-- Kalender med kommentar: https://cloud.timeedit.net/ltu/web/schedule1/ri10Q956X55Z07Q6Z76g5Y00y7016Y33706gQY7Q5476.html --> 

      <div class="filter-field">          
        <label for="kalenderdata"></label>         
        <button class="transfer-btn" id="fetch-cal-btn" type="button">Hämta kalenderdata</button>          
      </div>

      <div class="filter-field">          
        <label for="kalenderrensning"></label>         
        <button class="transfer-btn" id="empty-cal-btn" type="button">Töm alla fält</button> 
      </div>
    </section>

    <section class="filter-row" aria-label="Kursinfo"> 
      <div class="course-field">            
        <p id="course-code">
          Kurskod:
        </p>
        <p id="course-code-value">
        </p>
      </div>

      <div class="course-field">            
        <p id="course-name">
          Kursnamn:
        </p>
        <p id="course-name-value">
        </p>
      </div>
    </section>

    <section class="filter-row" aria-label="Kalenderöverföring">      
      <!-- KS: This redundant DIV "cal-type" is de-activated by "display: none" in CSS -->       
      <div class="filter-field" id="cal-type" aria-label="Kalendertyp">    
        <label for="kalenderval">Välj kalender i Canvas:</label> 
        <select id="kalendertyp" aria-label="Välj kalendertyp">
          <option>-</option>
          <option value="personlig">Personlig kalender</option>
          <option value="grupp">Gruppkalender</option>
          <option value="kurs">Kurskalender</option>          
        </select>       
      </div>                   

      <div class="filter-field" id="markings" aria-label="Markering">       
        <label for="markera-data">Markera:</label>  
        <button class="mark-btn" data-mark="all" id="mark-all-btn" type="button">Alla</button>
        <button class="mark-btn" data-mark="none" id="mark-none-btn" type="button">Inga</button>   
      </div>
      
      <div class="filter-field" id="id-input" aria-label="Kalenderinput-ID">       
        <label for="kalender-id">Canvas-ID för användare/kurs/grupp:</label>        
        <input
            type="text"
            id="cal-id"
            name="cal-id"
            placeholder="Typ: user_123 / course_456 / group_789">
      </div>

      <div class="filter-field" id="transfer-cal" aria-label="Överföring"> 
        <div class="selected">Antal markerade: <span id="count">0</span></div> 
        <button class="transfer-btn" id="transfer-cal-btn" type="button">Överför till Canvas</button> 
      </div>

      <div class="filter-field" id="note-info" aria-label="Notering"> 
        <div class="note">    <span>    * Stjärna avser redigerbara fält</span></div>       
      </div>
    </section>
    
    <div id="split-line">            
    </div>
    
    <section class="table-card" aria-label="Kalenderdata"> 
      <div class="table-wrap">   
        <table class="data-table">
          <thead>
            <tr>
              <th class="col-check"></th>
              <th class="col-date sortable" data-sort-key="date" scope="col" aria-sort="ascending">
                Datum<span class="sort sort-asc" aria-hidden="true"></span>
              </th>
              <th class="col-time sortable" data-sort-key="time" scope="col">
                Tid<span class="sort" aria-hidden="true"></span>
              </th>
              <th class="col-activity sortable" data-sort-key="activity-place" scope="col">
                Aktivitet & Plats<span class="sort" aria-hidden="true"></span>
              </th>
              <th class="col-person sortable" data-sort-key="person" scope="col">
                Anställd, Student *<span class="sort" aria-hidden="true"></span>
              </th>
              <th class="col-zoom sortable" data-sort-key="zoom" scope="col">
                Zoom-länk *<span class="sort" aria-hidden="true"></span>
              </th>
              <th class="col-comments sortable" data-sort-key="comments" scope="col">
                Kommentarer *<span class="sort" aria-hidden="true"></span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- REMOVE <PRE>-element below for final project-version  -->
    <pre id="json-output" class="json-display"></pre>  

  </main>  
</div>

<script src="main.js"></script>

</body>
</html>
